<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aufgabe in Planner</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="msal-browser.min.js?v=2"></script>
  <style>
    :root {
      --ink: #242424; --muted: #616161; --line: #d1d1d1;
      --accent: #185c37; --accent-hov: #0f4a2a;
      --bg: #ffffff; --field: #ffffff; --soft: #f5f5f5;
      --err: #b10e1c; --ok: #107c10;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px 16px; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: var(--ink); background: var(--bg); }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; }
    input[type=text], input[type=date] { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: var(--field); color: var(--ink); }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .combobox { position: relative; }
    .droplist { position: absolute; left: 0; right: 0; top: 100%; z-index: 10; max-height: 200px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 0 0 6px 6px; box-shadow: 0 6px 16px rgba(0,0,0,.15); display: none; }
    .droplist div { padding: 7px 10px; cursor: pointer; }
    .droplist div:hover, .droplist div.active { background: var(--soft); }
    .droplist .none { color: var(--muted); cursor: default; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; }
    .check input { width: 16px; height: 16px; accent-color: var(--accent); }
    button.primary { width: 100%; margin-top: 16px; padding: 9px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; }
    button.primary:hover { background: var(--accent-hov); }
    button.primary:disabled { background: #9aa8a0; cursor: default; }
    #status { margin-top: 14px; font-size: 13px; line-height: 1.5; }
    #status.err { color: var(--err); }
    #status.ok { color: var(--ok); }
    #status a { color: var(--accent); font-weight: 600; }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
    #detected { font-size: 11.5px; margin-top: 3px; color: var(--muted); }
    #detected b { color: var(--accent); }
    #login { display: none; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Aufgabe in Planner erstellen</h1>

  <div id="login">
    <button id="loginBtn" class="primary">Bei Microsoft anmelden</button>
    <div class="hint">Nur beim ersten Mal nötig: Anmelden und den drei Berechtigungen zustimmen — danach startet der Knopf künftig ohne Nachfrage.</div>
  </div>

  <div id="form">
    <label for="plan">Projekt / Plan</label>
    <div class="combobox">
      <input type="text" id="plan" placeholder="Pläne werden geladen …" autocomplete="off" />
      <div id="planlist" class="droplist"></div>
    </div>
    <div id="detected"></div>

    <label for="title">Titel der Aufgabe</label>
    <input type="text" id="title" autocomplete="off" />

    <label for="assign">Zuweisen an</label>
    <div class="combobox">
      <input type="text" id="assign" placeholder="Name tippen …" autocomplete="off" />
      <div id="assignlist" class="droplist"></div>
    </div>

    <label for="due">Fällig am (optional)</label>
    <input type="date" id="due" />


    <button id="create" class="primary" disabled>Aufgabe erstellen</button>
  </div>

  <div id="status"></div>

  <script src="taskpane.js?v=8"></script>
</body>
</html>
